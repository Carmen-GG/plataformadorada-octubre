<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plataforma Dorada · Backoffice</title>
  <style>
    :root{--brown:#704516;--gold:#c79b45;--cream:#fbf4e8;--line:#e5d7bd;--ink:#35281d}
    *{box-sizing:border-box} body{margin:0;font:15px Arial,sans-serif;background:var(--cream);color:var(--ink)}
    main{max-width:1100px;margin:0 auto;padding:28px 18px 60px} header{background:var(--brown);color:white;padding:22px;border-radius:18px;margin-bottom:20px}
    h1,h2,h3{margin:0 0 8px} .muted{opacity:.8}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}@media(max-width:760px){.grid{grid-template-columns:1fr}}
    section.panel{background:white;border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:18px;box-shadow:0 8px 24px #70451612}
    label{display:block;font-weight:700;margin:12px 0 6px} input,textarea,select{width:100%;padding:11px;border:1px solid #cdbd9e;border-radius:10px;font:inherit;background:#fff}
    textarea{min-height:90px;resize:vertical}.btn{border:0;border-radius:999px;padding:11px 18px;background:var(--brown);color:white;font-weight:700;cursor:pointer}.btn.secondary{background:#ead9b5;color:var(--brown)}
    .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.status{margin-top:10px;padding:10px;border-radius:10px;background:#f5ead5}.item{padding:12px 0;border-top:1px solid var(--line)} .item:first-child{border-top:0}
    #app{display:none}.danger{color:#8a2f1e}.small{font-size:12px}
    .tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}.tab{border:1px solid var(--line);border-radius:999px;padding:10px 18px;background:white;color:var(--brown);font-weight:700;cursor:pointer}.tab.active{background:var(--brown);color:white;border-color:var(--brown)}
    .tab-panel{display:none}.tab-panel.active{display:block}.check{display:flex;align-items:center;gap:8px;margin-top:14px;font-weight:700}.check input{width:auto}
  </style>
</head>
<body>
<main>
  <header><h1>Plataforma Dorada · Backoffice</h1><div class="muted">Noticias, eventos y recursos públicos</div></header>

  <section id="login" class="panel">
    <h2>Acceso de gestión</h2>
    <p>Introduce la contraseña del backoffice.</p>
    <label>Contraseña</label><input id="password" type="password" autocomplete="current-password">
    <button class="btn" onclick="login()">Entrar</button><div id="loginStatus" class="status" style="display:none"></div>
  </section>

  <div id="app">
    <nav class="tabs" aria-label="Secciones del backoffice">
      <button class="tab active" data-tab="newsTab" onclick="showTab('newsTab',this)">Noticias</button>
      <button class="tab" data-tab="eventsTab" onclick="showTab('eventsTab',this)">Eventos</button>
      <button class="tab" data-tab="resourcesTab" onclick="showTab('resourcesTab',this)">Recursos</button>
    </nav>

    <div id="newsTab" class="tab-panel active">
      <section class="panel">
        <h2>Publicar noticia</h2>
        <label>Titular</label><input id="title">
        <label>Medio</label><input id="media" placeholder="Ej.: La Vanguardia">
        <label>Fecha</label><input id="date" type="date">
        <label>URL de la noticia</label><input id="url" type="url">
        <label>Resumen (opcional)</label><textarea id="summary"></textarea>
        <button class="btn" onclick="saveNews()">Publicar noticia</button>
      </section>
    </div>

    <div id="eventsTab" class="tab-panel">
      <section class="panel">
        <h2>Publicar evento</h2>
        <p class="small muted">El evento aparecerá automáticamente en «Próximos eventos» o «Eventos realizados» según la fecha.</p>
        <div class="grid">
          <div>
            <label>Título del evento *</label><input id="eventTitle" placeholder="Ej.: Presentación de Plataforma Dorada">
          </div>
          <div>
            <label>Fecha *</label><input id="eventDate" type="date">
          </div>
          <div>
            <label>Hora</label><input id="eventTime" type="time">
          </div>
          <div>
            <label>Lugar</label><input id="eventPlace" placeholder="Ej.: Ateneu Municipal">
          </div>
          <div>
            <label>Ciudad</label><input id="eventCity" placeholder="Ej.: Terrassa">
          </div>
          <div>
            <label>Enlace (opcional)</label><input id="eventUrl" type="url" placeholder="https://...">
          </div>
        </div>
        <label>Descripción (opcional)</label><textarea id="eventDescription" placeholder="Información adicional del evento..."></textarea>
        <label class="check"><input id="eventPublished" type="checkbox" checked> Publicar en la web</label>
        <button class="btn" onclick="saveEvent()">Publicar evento</button>
      </section>
    </div>

    <div id="resourcesTab" class="tab-panel">
      <section class="panel">
        <h2>Subir recurso</h2>
        <label>Título</label><input id="resourceTitle">
        <label>Categoría</label><select id="category"><option>Documentos</option><option>Identidad</option><option>Carteles y banners</option><option>Material para redes</option><option>Otros</option></select>
        <label>Descripción</label><textarea id="description"></textarea>
        <label>Archivo (máx. 10 MB)</label><input id="file" type="file">
        <button class="btn" onclick="saveResource()">Subir recurso</button>
      </section>
    </div>

    <section class="panel"><div class="row"><h2 style="margin-right:auto">Contenido publicado</h2><button class="btn secondary" onclick="loadContent()">Actualizar</button></div><div id="listing"></div></section>
    <div id="status" class="status" style="display:none"></div>
  </div>
</main>
<script>
let pwd='';
function msg(text,login=false){const el=document.getElementById(login?'loginStatus':'status');el.textContent=text;el.style.display='block';}
function login(){pwd=document.getElementById('password').value;if(!pwd){msg('Introduce la contraseña.',true);return}google.script.run.withSuccessHandler(function(){document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';loadContent();}).withFailureHandler(function(e){msg(e.message||'No autorizado.',true)}).checkPassword(pwd)}
function showTab(id,button){document.querySelectorAll('.tab-panel').forEach(el=>el.classList.remove('active'));document.querySelectorAll('.tab').forEach(el=>el.classList.remove('active'));document.getElementById(id).classList.add('active');button.classList.add('active')}
function saveNews(){google.script.run.withSuccessHandler(function(){msg('Noticia publicada.');clearNews();loadContent()}).withFailureHandler(e=>msg(e.message||'No se pudo publicar.')).saveNews({password:pwd,title:title.value,media:media.value,date:date.value,url:url.value,summary:summary.value,published:true})}
function clearNews(){title.value='';media.value='';date.value='';url.value='';summary.value=''}
function saveEvent(){google.script.run.withSuccessHandler(function(){msg('Evento publicado.');clearEvent();loadContent()}).withFailureHandler(e=>msg(e.message||'No se pudo publicar el evento.')).saveEvent({password:pwd,title:eventTitle.value,date:eventDate.value,time:eventTime.value,place:eventPlace.value,city:eventCity.value,description:eventDescription.value,url:eventUrl.value,published:eventPublished.checked})}
function clearEvent(){eventTitle.value='';eventDate.value='';eventTime.value='';eventPlace.value='';eventCity.value='';eventDescription.value='';eventUrl.value='';eventPublished.checked=true}
function saveResource(){const f=document.getElementById('file').files[0];if(!f){msg('Selecciona un archivo.');return}if(f.size>10*1024*1024){msg('El archivo supera 10 MB.');return}const reader=new FileReader();reader.onload=function(){const base64=String(reader.result).split(',')[1];google.script.run.withSuccessHandler(function(){msg('Recurso subido.');document.getElementById('file').value='';loadContent()}).withFailureHandler(e=>msg(e.message||'No se pudo subir.')).saveResource({password:pwd,title:resourceTitle.value,category:category.value,description:description.value,fileName:f.name,mimeType:f.type,base64:base64})};reader.readAsDataURL(f)}
function loadContent(){google.script.run.withSuccessHandler(render).withFailureHandler(e=>msg(e.message||'No se pudo cargar.')).getPublicContent_()}
function render(data){let html='<h3>Noticias</h3>';html+=data.noticias.length?data.noticias.map(n=>`<div class="item"><b>${esc(n.title)}</b> · ${esc(n.media)} · ${esc(n.date)}<br><a href="${esc(n.url)}" target="_blank">${esc(n.url)}</a><br><button class="btn secondary" onclick="delNews('${n.id}')">Eliminar</button></div>`).join(''):'<p>No hay noticias.</p>';html+='<h3 style="margin-top:22px">Eventos</h3>';html+=data.eventos&&data.eventos.length?data.eventos.map(e=>`<div class="item"><b>${esc(e.title)}</b> · ${esc(e.date)}${e.time?' · '+esc(e.time):''}<br>${esc(e.place)}${e.city?' · '+esc(e.city):''}${e.description?'<br>'+esc(e.description):''}${e.url?'<br><a href="'+esc(e.url)+'" target="_blank">Abrir enlace</a>':''}<br><button class="btn secondary" onclick="delEvent('${e.id}')">Eliminar</button></div>`).join(''):'<p>No hay eventos.</p>';html+='<h3 style="margin-top:22px">Recursos</h3>';html+=data.recursos.length?data.recursos.map(r=>`<div class="item"><b>${esc(r.title)}</b> · ${esc(r.category)} · ${esc(r.filename)}<br><a href="${esc(r.url)}" target="_blank">Abrir recurso</a><br><button class="btn secondary" onclick="delResource('${r.id}')">Eliminar</button></div>`).join(''):'<p>No hay recursos.</p>';document.getElementById('listing').innerHTML=html}
function delNews(id){if(confirm('¿Eliminar esta noticia?'))google.script.run.withSuccessHandler(loadContent).withFailureHandler(e=>msg(e.message||'Error')).deleteNews({password:pwd,id:id})}
function delEvent(id){if(confirm('¿Eliminar este evento?'))google.script.run.withSuccessHandler(loadContent).withFailureHandler(e=>msg(e.message||'Error')).deleteEvent({password:pwd,id:id})}
function delResource(id){if(confirm('¿Eliminar este recurso? También se enviará el archivo a la papelera de Drive.'))google.script.run.withSuccessHandler(loadContent).withFailureHandler(e=>msg(e.message||'Error')).deleteResource({password:pwd,id:id})}
function esc(v){return String(v||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
</script>
</body></html>
