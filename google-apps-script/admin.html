<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Plataforma Dorada · Backoffice</title><style>:root{--brown:#704516;--gold:#c79b45;--cream:#fbf4e8;--line:#e5d7bd;--ink:#35281d}*{box-sizing:border-box}body{margin:0;font:15px Arial,sans-serif;background:var(--cream);color:var(--ink)}main{max-width:1100px;margin:auto;padding:28px 18px 60px}header{background:var(--brown);color:#fff;padding:22px;border-radius:18px;margin-bottom:20px}h1,h2,h3{margin:0 0 8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}@media(max-width:800px){.grid{grid-template-columns:1fr}}section{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:18px;box-shadow:0 8px 24px #70451612}label{display:block;font-weight:700;margin:12px 0 6px}input,textarea,select{width:100%;padding:11px;border:1px solid #cdbd9e;border-radius:10px;font:inherit;background:#fff}textarea{min-height:90px;resize:vertical}.btn{border:0;border-radius:999px;padding:11px 18px;background:var(--brown);color:#fff;font-weight:700;cursor:pointer}.btn.secondary{background:#ead9b5;color:var(--brown)}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.status{margin-top:10px;padding:10px;border-radius:10px;background:#f5ead5}.item{padding:14px 0;border-top:1px solid var(--line)}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.tab{border:1px solid var(--line);background:#fff;padding:9px 15px;border-radius:999px;font-weight:700;cursor:pointer}.tab.active{background:var(--brown);color:#fff}.small{font-size:12px;opacity:.75}.danger{color:#8a2f1e}</style></head><body><main><header><h1>Plataforma Dorada · Backoffice</h1><div>Noticias · Eventos · Recursos · Propuestas</div></header><section id="login"><h2>Acceso de gestión</h2><label>Contraseña</label><input id="password" type="password" autocomplete="current-password"><button class="btn" onclick="login()">Entrar</button><div id="loginStatus" class="status" style="display:none"></div></section><div id="app" style="display:none"><div class="tabs"><button class="tab active" onclick="showTab('news',this)">Noticias</button><button class="tab" onclick="showTab('events',this)">Eventos</button><button class="tab" onclick="showTab('resources',this)">Recursos</button><button class="tab" onclick="showTab('proposals',this)">Propuestas</button></div><div id="news" class="tabpage"><section><h2>Publicar noticia</h2><label>Titular</label><input id="title"><label>Medio</label><input id="media"><label>Fecha</label><input id="date" type="date"><label>URL</label><input id="url" type="url"><label>Resumen</label><textarea id="summary"></textarea><button class="btn" onclick="saveNews()">Publicar noticia</button></section></div><div id="events" class="tabpage" style="display:none"><section><h2 id="eventFormTitle">Crear evento</h2><input id="eventId" type="hidden"><label>Título</label><input id="eventTitle"><div class="grid"><div><label>Fecha</label><input id="eventDate" type="date"></div><div><label>Hora</label><input id="eventTime" type="time"></div></div><div class="grid"><div><label>Lugar</label><input id="eventPlace"></div><div><label>Ciudad</label><input id="eventCity"></div></div><label>Descripción</label><textarea id="eventDescription"></textarea><label>Enlace opcional</label><input id="eventUrl" type="url"><label>Documento / imagen (máx. 10 MB)</label><input id="eventFile" type="file" accept="image/*,application/pdf"><div class="small" id="currentDoc"></div><button class="btn" onclick="saveEvent()">Guardar evento</button> <button class="btn secondary" onclick="clearEvent()">Limpiar</button></section><section><h2>Eventos existentes</h2><div id="eventList"></div></section></div><div id="resources" class="tabpage" style="display:none"><section><h2>Subir recurso</h2><label>Título</label><input id="resourceTitle"><label>Categoría</label><select id="category"><option>Documentación</option><option>Material para prensa</option><option>Identidad</option><option>Carteles y banners</option><option>Material para redes</option><option>Otros</option></select><label>Descripción</label><textarea id="description"></textarea><label>Archivo (máx. 10 MB)</label><input id="file" type="file"><button class="btn" onclick="saveResource()">Subir recurso</button></section><section><h2>Recursos publicados</h2><div id="resourceList"></div></section></div><div id="proposals" class="tabpage" style="display:none"><section><h2>Propuestas pendientes</h2><div id="proposalList"></div></section></div><div id="status" class="status" style="display:none"></div></div></main><script>let pwd='',content={};const $=id=>document.getElementById(id);function msg(t,login=false){const e=$(login?'loginStatus':'status');e.textContent=t;e.style.display='block'}function login(){pwd=$('password').value;if(!pwd)return msg('Introduce la contraseña.',true);google.script.run.withSuccessHandler(()=>{$('login').style.display='none';$('app').style.display='block';loadContent()}).withFailureHandler(e=>msg(e.message||'No autorizado.',true)).checkPassword(pwd)}function showTab(id,btn){document.querySelectorAll('.tabpage').forEach(x=>x.style.display='none');$(id).style.display='block';document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));btn.classList.add('active')}function loadContent(){google.script.run.withSuccessHandler(d=>{content=d;renderEvents();renderResources();renderProposals()}).withFailureHandler(e=>msg(e.message||'No se pudo cargar.')).getPublicContent_()}function saveNews(){google.script.run.withSuccessHandler(()=>{msg('Noticia publicada.');['title','media','date','url','summary'].forEach(x=>$(x).value='');loadContent()}).withFailureHandler(e=>msg(e.message||'No se pudo publicar.')).saveNews({password:pwd,title:$('title').value,media:$('media').value,date:$('date').value,url:$('url').value,summary:$('summary').value,published:true})}function readFile(input,cb){const f=input.files[0];if(!f)return cb(null);if(f.size>10*1024*1024)return msg('El archivo supera 10 MB.');const r=new FileReader();r.onload=()=>cb({name:f.name,mimeType:f.type,base64:String(r.result).split(',')[1]});r.readAsDataURL(f)}function saveResource(){readFile($('file'),f=>{if(!f)return msg('Selecciona un archivo.');google.script.run.withSuccessHandler(()=>{msg('Recurso subido.');$('file').value='';loadContent()}).withFailureHandler(e=>msg(e.message||'No se pudo subir.')).saveResource({password:pwd,title:$('resourceTitle').value,category:$('category').value,description:$('description').value,fileName:f.name,mimeType:f.mimeType,base64:f.base64})})}function saveEvent(){if(!$('eventTitle').value||!$('eventDate').value)return msg('Indica título y fecha.');readFile($('eventFile'),f=>{const data={password:pwd,id:$('eventId').value,title:$('eventTitle').value,date:$('eventDate').value,time:$('eventTime').value,place:$('eventPlace').value,city:$('eventCity').value,description:$('eventDescription').value,url:$('eventUrl').value,published:true};if(f){data.fileName=f.name;data.mimeType=f.mimeType;data.base64=f.base64}google.script.run.withSuccessHandler(()=>{msg('Evento guardado.');clearEvent();loadContent()}).withFailureHandler(e=>msg(e.message||'No se pudo guardar.')).saveEvent(data)})}function clearEvent(){$('eventId').value='';$('eventTitle').value='';$('eventDate').value='';$('eventTime').value='';$('eventPlace').value='';$('eventCity').value='';$('eventDescription').value='';$('eventUrl').value='';$('eventFile').value='';$('currentDoc').textContent='';$('eventFormTitle').textContent='Crear evento'}function renderEvents(){$('eventList').innerHTML=(content.eventos||[]).map(e=>`<div class="item"><b>${esc(e.title)}</b> · ${esc(e.date)} · ${esc(e.city)}<br>${esc(e.place)}${e.documentUrl?`<br><a href="${esc(e.documentUrl)}" target="_blank">${esc(e.documentName||'Documento')}</a>`:''}<div class="row" style="margin-top:8px"><button class="btn secondary" onclick="editEvent('${esc(e.id)}')">Editar</button><button class="btn secondary" onclick="delEvent('${esc(e.id)}')">Eliminar</button></div></div>`).join('')||'<p>No hay eventos.</p>'}function editEvent(id){const e=(content.eventos||[]).find(x=>x.id===id);if(!e)return;$('eventId').value=e.id;$('eventTitle').value=e.title;$('eventDate').value=e.date;$('eventTime').value=e.time;$('eventPlace').value=e.place;$('eventCity').value=e.city;$('eventDescription').value=e.description;$('eventUrl').value=e.url;$('currentDoc').innerHTML=e.documentUrl?`Documento actual: <a href="${esc(e.documentUrl)}" target="_blank">${esc(e.documentName||'abrir')}</a>. Si subes otro, sustituirá al actual.`:'';$('eventFormTitle').textContent='Editar evento';window.scrollTo({top:0,behavior:'smooth'})}function delEvent(id){if(confirm('¿Eliminar el evento y su documento de Drive?'))google.script.run.withSuccessHandler(loadContent).withFailureHandler(e=>msg(e.message||'Error')).deleteEvent({password:pwd,id:id})}function renderResources(){$('resourceList').innerHTML=(content.recursos||[]).map(r=>`<div class="item"><b>${esc(r.title)}</b> · ${esc(r.category)} · ${esc(r.filename)}<br><a href="${esc(r.url)}" target="_blank">Abrir recurso</a> <button class="btn secondary" onclick="delResource('${esc(r.id)}')">Eliminar</button></div>`).join('')||'<p>No hay recursos.</p>'}function delResource(id){if(confirm('¿Eliminar el recurso y enviar el archivo a la papelera de Drive?'))google.script.run.withSuccessHandler(loadContent).withFailureHandler(e=>msg(e.message||'Error')).deleteResource({password:pwd,id:id})}function renderProposals(){google.script.run.withSuccessHandler(d=>{const pending=(d.todas||[]).filter(x=>!x.published);$('proposalList').innerHTML=pending.map(x=>`<div class="item"><b>${esc(x.type==='cancion'?x.title:x.text)}</b>${x.type==='cancion'?` · ${esc(x.artist)}`:''}<br><span class="small">Proponente: ${esc(x.proposer||'No indicado')}</span><div class="row" style="margin-top:8px"><button class="btn" onclick="publishProposal('${esc(x.id)}')">Aprobar</button><button class="btn secondary" onclick="deleteProposal('${esc(x.id)}')">Eliminar</button></div></div>`).join('')||'<p>No hay propuestas pendientes.</p>'}).getBackofficeContent()}function publishProposal(id){google.script.run.withSuccessHandler(loadContent).withFailureHandler(e=>msg(e.message||'Error')).setPublished_({password:pwd,id:id,published:true})}function deleteProposal(id){if(confirm('¿Eliminar propuesta?'))google.script.run.withSuccessHandler(loadContent).withFailureHandler(e=>msg(e.message||'Error')).deleteProposal({password:pwd,id:id})}function esc(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}</script></body></html>
