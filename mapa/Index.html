<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mapa Plataforma Dorada</title>\n  <!-- Base OSM: sin API key y sin relieve -->

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    html, body {
      height: 100%;
      margin: 0;
      font-family: Arial, sans-serif;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    #status {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: white;
      padding: 8px 14px;
      border-radius: 18px;
      box-shadow: 0 2px 10px rgba(0,0,0,.18);
      font-size: 13px;
    }

    .legend {
      background: white;
      padding: 10px 12px;
      border-radius: 8px;
      box-shadow: 0 2px 10px rgba(0,0,0,.18);
      line-height: 20px;
      max-height: 55vh;
      overflow-y: auto;
    }

    .legend-title {
      font-weight: bold;
      margin-bottom: 6px;
    }

    .dot {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      margin-right: 6px;
      vertical-align: -1px;
    }
  </style>
</head>

<body>
  <div id="status">Cargando registros…</div>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const map = L.map('map').setView([41.563, 2.008], 10);

    L.tileLayer(
      'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
      {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors'
      }
    ).addTo(map);

    const palette = [
      '#e53935', '#1e88e5', '#43a047', '#8e24aa',
      '#fb8c00', '#00acc1', '#6d4c41', '#3949ab',
      '#00897b', '#d81b60', '#5e35b1', '#7cb342',
      '#f4511e', '#039be5', '#8d6e63'
    ];

    let markersLayer = L.layerGroup().addTo(map);
    let legendControl = null;

    function escapeHtml(value) {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function createIcon(color) {
      return L.divIcon({
        className: '',
        html: `
          <div style="
            width:16px;
            height:16px;
            border-radius:50%;
            background:${color};
            border:2px solid white;
            box-shadow:0 1px 5px rgba(0,0,0,.45);
          "></div>`,
        iconSize: [20, 20],
        iconAnchor: [10, 10],
        popupAnchor: [0, -10]
      });
    }

    function render(data) {
      markersLayer.clearLayers();

      if (legendControl) {
        map.removeControl(legendControl);
        legendControl = null;
      }

      const creators = [
        ...new Set(
          data.map(x => x.creador || 'Sin persona voluntaria')
        )
      ];

      const colorByCreator = {};

      creators.forEach((creator, i) => {
        colorByCreator[creator] =
          palette[i % palette.length];
      });

      const bounds = [];

      data.forEach(item => {
        const creator =
          item.creador || 'Sin persona voluntaria';

        const color = colorByCreator[creator];

        const marker = L.marker(
          [item.lat, item.lng],
          { icon: createIcon(color) }
        ).addTo(markersLayer);

        marker.bindPopup(`
          <strong>${escapeHtml(item.municipio)}</strong><br>
          Persona voluntaria: ${escapeHtml(creator)}
        `);

        bounds.push([item.lat, item.lng]);
      });

      legendControl = L.control({
        position: 'topright'
      });

      legendControl.onAdd = function() {
        const div = L.DomUtil.create(
          'div',
          'legend'
        );

        let html =
          '<div class="legend-title">Persona voluntaria</div>';

        creators.forEach(creator => {
          html += `
            <div>
              <span class="dot"
                style="background:${colorByCreator[creator]}">
              </span>
              ${escapeHtml(creator)}
            </div>`;
        });

        div.innerHTML = html;
        return div;
      };

      legendControl.addTo(map);

      if (bounds.length) {
        map.fitBounds(
          bounds,
          { padding: [30, 30] }
        );
      }

      document.getElementById('status').textContent =
        data.length + ' registros en el mapa';

      setTimeout(() => {
        document.getElementById('status').style.display =
          'none';
      }, 2000);
    }

    function loadMap() {
      const status =
        document.getElementById('status');

      status.style.display = 'block';
      status.textContent = 'Actualizando mapa…';

      google.script.run
        .withSuccessHandler(render)
        .withFailureHandler(function(error) {
          status.textContent =
            'Error: ' +
            (error.message || error);
        })
        .getMapData();
    }

    loadMap();

    // Actualización automática cada minuto.
    setInterval(loadMap, 60000);
  </script>
</body>
</html>
